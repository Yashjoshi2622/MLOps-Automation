name: MLOps Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run MLOps generator
        run: |
          python scripts/generate_project.py .

      - name: Commit generated MLOps files
        env:
          GH_TOKEN: ${{ secrets.MLOPS_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No new MLOps files to commit."
          else
            git commit -m "chore: bootstrap MLOps setup"
            git push https://x-access-token:${GH_TOKEN}@github.com/Yashjoshi2622/MLOps-Automation.git
          fi