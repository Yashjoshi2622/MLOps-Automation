name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          # Run pytest; exit code 5 means "no tests collected" which is
          # acceptable for a brand-new project (smoke test should prevent this).
          set +e
          pytest --tb=short -q
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 5 ]; then
            echo "No tests collected — treating as success for brand-new project."
            exit 0
          fi
          exit $EXIT_CODE
